<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Spend</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </div>
  <div class="top-actions">
    <button id="report-btn" class="btn-report">Generate full report</button>
    <button id="email-btn" class="btn-email" type="button" title="Open a mail draft with the briefing and download the full report to attach">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path fill="currentColor" d="M1.5 3h13A1.5 1.5 0 0 1 16 4.5v7A1.5 1.5 0 0 1 14.5 13h-13A1.5 1.5 0 0 1 0 11.5v-7A1.5 1.5 0 0 1 1.5 3Zm.4 1.3 6.1 4.07L14.1 4.3H1.9Zm12.6 1.16-5.66 3.77a1.5 1.5 0 0 1-1.68 0L1.5 5.46V11.5a.5.5 0 0 0 .5.5h12a.5.5 0 0 0 .5-.5V5.46Z"/>
      </svg>
      Email report
    </button>
  </div>
</header>

<div class="tabs" role="tablist" id="tabs">
  <button role="tab" class="tab" data-tile="tile1" aria-selected="true">
    <b>1</b><span>Where the money went</span>
  </button>
  <button role="tab" class="tab" data-tile="tile2" aria-selected="false">
    <b>2</b><span>Where to cut</span>
  </button>
  <button role="tab" class="tab" data-tile="tile3" aria-selected="false">
    <b>3</b><span>What it costs if we're wrong</span>
  </button>
</div>

<main>

  <!-- ===================================================== TILE 1 ========= -->
  <section class="tile" id="tile1" role="tabpanel">
    <div class="kpis" id="t1-kpis"></div>

    <!-- Tabs 1 and 2 share this layout exactly, so the same bucket sits in the same
         place on both and the CFO can read across from spend to proposal. -->
    <div class="two-col">
      <figure class="fig">
        <figcaption><b>Where every dollar of the bill went</b>
          <span class="fig-hint">Hover a slice to see what it is</span></figcaption>
        <div class="donut-wrap">
          <svg id="c-donut" viewBox="0 0 280 280" role="img"></svg>
        </div>
      </figure>

      <div class="col">
        <h3>Current Spend</h3>
        <div class="rows" id="t1-buckets"></div>
      </div>
    </div>
  </section>

  <!-- ===================================================== TILE 2 ========= -->
  <section class="tile" id="tile2" role="tabpanel" hidden>
    <div class="kpis" id="t2-kpis"></div>

    <div class="two-col">
      <figure class="fig">
        <figcaption><b>The same wheel, with the cut hatched out</b>
          <span class="fig-hint">Hover a slice to see what it is</span></figcaption>
        <div class="donut-wrap">
          <svg id="t2-wheel" viewBox="0 0 280 280" role="img"></svg>
        </div>
      </figure>

      <div class="col">
        <h3>Proposed Actions</h3>
        <div class="rows" id="t2-actions"></div>
      </div>
    </div>
  </section>

  <!-- ===================================================== TILE 3 ========= -->
  <section class="tile" id="tile3" role="tabpanel" hidden>
    <div class="kpis" id="t3-kpis"></div>

    <div class="col">
      <h3>Four calls, and what happens if we get them wrong</h3>
      <div class="rows" id="t3-risks"></div>
    </div>
  </section>

  <!-- ====================================================== REPORT ======== -->
  <section id="report" hidden>
    <div class="report-toolbar">
      <button id="report-close" class="btn-plain">&larr; Back to dashboard</button>
      <span class="report-title">Full analysis</span>
      <span class="report-actions">
        <button id="report-md" class="btn-plain">Download (.md)</button>
        <button id="report-email" class="btn-plain">Email report</button>
        <button id="report-print" class="btn-plain">Print / PDF</button>
      </span>
    </div>
    <div id="report-body"></div>
  </section>

  <footer id="footer"></footer>
</main>

<script src="app.js"></script>
</body>
</html>
