<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Spend Review</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3f0;
    --surface-1: #fcfcfb;
    --surface-2: #eeede9;
    --border: #dcdbd5;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #77756f;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --critical: #e34948;
    --good: #008300;
    --grid: #e4e3de;
    --shadow: 0 1px 2px rgba(11,11,11,.06), 0 4px 12px rgba(11,11,11,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --surface-2: #242423;
      --border: #383835;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #94938a;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --critical: #e66767;
      --good: #35b135;
      --grid: #2e2e2c;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110;
    --surface-1: #1a1a19;
    --surface-2: #242423;
    --border: #383835;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #94938a;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --critical: #e66767;
    --good: #35b135;
    --grid: #2e2e2c;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface-0); color: var(--text-primary);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 80px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 17px; margin: 0 0 4px; letter-spacing: -.01em; }
  h3 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: var(--text-secondary); font-size: 13px; margin: 2px 0 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .ghost {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; font-size: 13px;
  }
  .ghost:hover { background: var(--surface-2); }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; box-shadow: var(--shadow); margin-top: 18px;
  }
  .tileno {
    display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 6px;
  }
  /* hero */
  .hero { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; }
  .figure { font-size: 54px; line-height: 1; font-weight: 600; letter-spacing: -.03em; }
  .figure small { font-size: 18px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0; }
  .kpis { display: flex; flex-wrap: wrap; gap: 26px; }
  .kpi .v { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .kpi .l { font-size: 12px; color: var(--text-secondary); }
  .range { color: var(--text-secondary); font-size: 13px; }
  /* charts */
  .chartrow { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 14px; }
  @media (max-width: 820px) { .chartrow { grid-template-columns: 1fr; } }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .lbl { font-size: 11.5px; fill: var(--text-secondary); }
  .val { font-size: 11.5px; fill: var(--text-primary); font-variant-numeric: tabular-nums; }
  .axis { stroke: var(--grid); stroke-width: 1; }
  .mark { transition: opacity .12s; }
  .mark:hover { opacity: .82; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-secondary); margin: 8px 0 0; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
  /* actions */
  .action {
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 12px;
    background: var(--surface-1);
  }
  .action.open { border-color: var(--series-1); }
  .action > summary { cursor: pointer; list-style: none; display: block; }
  .action > summary::-webkit-details-marker { display: none; }
  .arow { display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; justify-content: space-between; }
  .arow > :first-child { flex: 1 1 380px; min-width: 0; }
  .arow > :last-child { flex: 0 0 auto; margin-left: auto; }
  .money { font-size: 24px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
  .tag {
    font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
    color: var(--text-secondary); background: var(--surface-2);
  }
  .meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; }
  .drill { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 8px; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  th { color: var(--text-secondary); font-weight: 500; font-size: 11.5px; }
  tbody tr:hover { background: var(--surface-2); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .risk { border-left: 3px solid var(--critical); padding-left: 12px; margin-top: 10px; font-size: 13px; color: var(--text-secondary); }
  .wrongcard { border: 1px solid var(--border); border-left: 3px solid var(--critical); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .verdict { color: var(--critical); font-weight: 600; font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; margin-top: 12px; }
  .note { font-size: 12.5px; color: var(--text-muted); }
  footer { margin-top: 26px; font-size: 12px; color: var(--text-muted); }
  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 12.5px; box-shadow: var(--shadow); z-index: 20; max-width: 280px;
  }
  #tip b { font-variant-numeric: tabular-nums; }
  .pricetag { font-size: 11px; color: var(--text-muted); }
  .pricetag b { color: var(--series-1); }
  .bad { color: var(--critical); }
  .ok { color: var(--good); }
</style>
</head>
<body data-palette="#2a78d6,#eb6834,#1baf7a">
<div class="wrap">
  <header>
    <div>
      <h1>GPU spend review &mdash; MIT SuperCloud sample</h1>
      <p class="sub" id="subtitle">loading&hellip;</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <label class="ghost" style="display:flex;gap:6px;align-items:center" title="Re-price everything. The API re-tags its response 2026-Q3+custom.">
        $<input id="rate" type="number" min="0.1" max="50" step="0.25" value="2.50"
               style="width:62px;background:transparent;border:0;color:inherit;font:inherit">
        <span style="color:var(--text-secondary)">/GPU-hour</span>
      </label>
      <button class="ghost" id="tables">Show all tables</button>
      <button class="ghost" id="theme">Dark</button>
    </div>
  </header>

  <section class="card" id="hero"></section>
  <section class="card" id="tile1"></section>
  <section class="card" id="tile2"></section>
  <section class="card" id="tile3"></section>
  <section class="card" id="extras"></section>
  <footer id="footer"></footer>
</div>
<div id="tip" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
