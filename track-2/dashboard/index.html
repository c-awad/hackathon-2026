<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Spend</title>
<!-- UI design (shell, tabs, KPI rows, spend wheel, row components, stylesheet) by
     Shruti Doshi: see "Shruti's dashboard/". Data, drill-downs, live API calls and
     the scheduler simulation come from dashboard/build.py. -->
<link rel="stylesheet" href="styles.css?v=7">
<link rel="stylesheet" href="extra.css?v=7">
</head>
<body>

<header class="top">
  <div>
    <h1 id="title">GPU spend review</h1>
    <p class="sub" id="subtitle">loading&hellip;</p>
  </div>
  <div class="top-actions">
    <label class="btn-email ratebox" title="Re-price everything. The API tags its answer 2026-Q3+custom.">
      $<input id="rate" type="number" min="0.1" max="50" step="0.25" value="2.50">
      <span>/GPU-hour</span>
    </label>
    <a class="btn-report" href="classic/" title="The same data as one long scrolling page">Long-form view</a>
  </div>
</header>

<div class="tabs" role="tablist" id="tabs">
  <button role="tab" class="tab" data-tile="tile1" aria-selected="true"><b>1</b><span>Where the money went</span></button>
  <button role="tab" class="tab" data-tile="tile2" aria-selected="false"><b>2</b><span>Where to cut</span></button>
  <button role="tab" class="tab" data-tile="tile3" aria-selected="false"><b>3</b><span>What it costs if we're wrong</span></button>
  <button role="tab" class="tab" data-tile="tile4" aria-selected="false"><b>4</b><span>Will researchers wait?</span></button>
  <button role="tab" class="tab" data-tile="tile5" aria-selected="false"><b>5</b><span>The evidence</span></button>
</div>

<main>
  <section class="tile" id="tile1" role="tabpanel">
    <div class="kpis" id="t1-kpis"></div>
    <div class="two-col">
      <figure class="fig">
        <figcaption><b>Where every dollar of the bill went</b>
          <span class="fig-hint">Hover a slice to see what it is</span></figcaption>
        <div class="donut-wrap"><svg id="c-donut" viewBox="0 0 280 280" role="img"></svg></div>
      </figure>
      <div class="col">
        <h3>Current spend</h3>
        <div class="rows" id="t1-buckets"></div>
      </div>
    </div>
  </section>

  <section class="tile" id="tile2" role="tabpanel" hidden>
    <div class="kpis" id="t2-kpis"></div>
    <div class="two-col">
      <figure class="fig">
        <figcaption><b>The same wheel, with the cut hatched out</b>
          <span class="fig-hint">Hover a slice &middot; click a row for the jobs behind it</span></figcaption>
        <div class="donut-wrap"><svg id="t2-wheel" viewBox="0 0 280 280" role="img"></svg></div>
      </figure>
      <div class="col">
        <h3>Proposed actions <span class="fig-hint">click a row for the evidence</span></h3>
        <div class="rows" id="t2-actions"></div>
      </div>
    </div>
    <div id="t2-drill" class="drillbox" hidden></div>
  </section>

  <section class="tile long" id="tile3" role="tabpanel" hidden>
    <div class="kpis" id="t3-kpis"></div>
    <div class="col">
      <h3>Four calls, and what happens if we get them wrong <span class="fig-hint">click a row for the evidence</span></h3>
      <div class="rows autorows" id="t3-risks"></div>
    </div>
  </section>

  <section class="tile long" id="tile4" role="tabpanel" hidden>
    <div class="kpis" id="t4-kpis"></div>
    <div id="t4-body"></div>
  </section>

  <section class="tile long" id="tile5" role="tabpanel" hidden>
    <div class="kpis" id="t5-kpis"></div>
    <div id="t5-body"></div>
  </section>

  <footer id="footer"></footer>
</main>

<div class="wheel-tip" id="tip" hidden></div>
<script src="app.js?v=7"></script>
</body>
</html>
