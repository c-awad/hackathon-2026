# `docker compose up` -> dashboard on :3000, API on :8000, Jupyter on :8888.
# This file sits at the repository root, as the brief asks; the project lives in
# track-2/. ./data here is a symlink to track-2/data, so data generated by the
# track-2 Makefile and data placed in ./data at the root are the same files.
# `docker compose` also finds this file from inside track-2/, so `make prep`,
# `make generate` and `make check-data` keep working there.
services:
  api:
    build:
      context: ./track-2
      dockerfile: api/Dockerfile.local
    ports: ["8000:8000"]
    volumes:
      - ./track-2/api:/app/api:ro
      - ./data:/app/data:ro
    environment: [PYTHONUNBUFFERED=1]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The dashboard the judges open: http://localhost:3000
  # It builds dashboard/data.json from ./data on startup, then serves the page.
  dashboard:
    build:
      context: ./track-2
      dockerfile: dashboard/Dockerfile
    ports: ["3000:3000"]
    volumes:
      - ./data:/app/data:ro
      - ./track-2/dashboard:/app/dashboard
      - ./track-2/analysis:/app/analysis:ro
    environment:
      - MGAI_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      api: {condition: service_healthy}

  # Run once after downloading the raw data:
  #   docker compose run --rm prep
  # It uses the same pinned image as the API, so the tables it writes are
  # byte-identical on every machine.
  prep:
    build:
      context: ./track-2
      dockerfile: api/Dockerfile.local
    volumes:
      - ./data:/app/data
      - ./track-2/scripts:/app/scripts:ro
    command: ["python", "scripts/prep_data.py"]
    profiles: ["tools"]

  # Run after prep:
  #   docker compose run --rm generate
  # Runs the generator in bin/ that matches this machine's chip, reading
  # data/prepped/ and writing data/synthetic/. It is copied to /tmp first so it
  # runs even if the file lost its executable bit (a repository downloaded as a ZIP).
  generate:
    build:
      context: ./track-2
      dockerfile: api/Dockerfile.local
    volumes:
      - ./data:/app/data
      - ./track-2/bin:/app/bin:ro
    command: ["sh", "-c",
      "a=$$(uname -m); case $$a in x86_64|amd64) a=amd64;; aarch64|arm64) a=arm64;; esac; cp bin/mantisgrid-generate-linux-$$a /tmp/gen && chmod +x /tmp/gen && /tmp/gen data"]
    profiles: ["tools"]

  notebook:
    build:
      context: ./track-2
      dockerfile: starter/Dockerfile
    ports: ["8888:8888"]
    volumes: ["./track-2/starter:/work"]
    environment:
      - MGAI_URL=http://api:8000
    depends_on:
      api: {condition: service_healthy}
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --allow-root --NotebookApp.token='' --NotebookApp.password=''
